# /etc/nginx/sites-available/pinjaman  (ganti pinjaman.example.com)
# Sertifikat: sudo certbot --nginx -d pinjaman.example.com

server {
    listen 80;
    listen [::]:80;
    server_name pinjaman.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pinjaman.example.com;

    ssl_certificate     /etc/letsencrypt/live/pinjaman.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pinjaman.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/pinjaman/public;
    index index.php;
    charset utf-8;
    client_max_body_size 5m;
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Tidak ada akses ke file tersembunyi (.env, .git) kecuali .well-known untuk sertifikat.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
